name: Build Windows

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows Release
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Install WebView2 NuGet package
        shell: pwsh
        run: |
          $out = Join-Path $env:LOCALAPPDATA "PackageManagement\NuGet\Packages"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/v6.11.0/nuget.exe" -OutFile nuget.exe
          .\nuget.exe install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory $out -NonInteractive
          $pkg = Get-ChildItem $out -Directory -Filter "Microsoft.Web.WebView2*" | Select-Object -First 1
          if (-not $pkg) { throw "WebView2 NuGet package not found under $out" }
          Write-Host "Installed $($pkg.Name)"

      - name: Configure CMake
        shell: pwsh
        env:
          # Publishable Tone3000 key — set as a repo secret (Settings → Secrets → Actions)
          Namplifier_TONE3000_KEY: ${{ secrets.Namplifier_TONE3000_KEY }}
        run: |
          if (-not $env:Namplifier_TONE3000_KEY) {
            Write-Warning "Secret Namplifier_TONE3000_KEY is empty — Tone3000 login will not work in this build."
          }
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DNamplifier_TONE3000_KEY="$env:Namplifier_TONE3000_KEY"

      - name: Build Standalone + VST3
        run: cmake --build build --config Release --target Namplifier_Standalone Namplifier_VST3 --parallel 4

      - name: Package Standalone
        shell: pwsh
        run: |
          $pkg = "dist/Namplifier-windows-standalone"
          New-Item -ItemType Directory -Force -Path "$pkg/ui/dist" | Out-Null
          Copy-Item "build/Namplifier_artefacts/Release/Standalone/Namplifier.exe" $pkg
          Copy-Item -Recurse -Force "ui/dist/*" "$pkg/ui/dist/"
          Compress-Archive -Path $pkg -DestinationPath "dist/Namplifier-windows-standalone.zip" -Force

      - name: Package VST3
        shell: pwsh
        run: |
          $src = Get-ChildItem "build/Namplifier_artefacts/Release/VST3" -Filter "Namplifier.vst3" -Recurse -Directory |
            Select-Object -First 1
          if (-not $src) {
            $src = Get-ChildItem "build/Namplifier_artefacts/Release/VST3" -Filter "Namplifier.vst3" -Recurse |
              Select-Object -First 1
          }
          if (-not $src) { throw "VST3 artefact not found" }
          $pkg = "dist/Namplifier-windows-vst3"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          if ($src.PSIsContainer) {
            Copy-Item -Recurse -Force $src.FullName $pkg
          } else {
            Copy-Item -Force $src.FullName $pkg
          }
          # VST3 editors also need the UI next to the bundle for this project layout
          New-Item -ItemType Directory -Force -Path "$pkg/ui/dist" | Out-Null
          Copy-Item -Recurse -Force "ui/dist/*" "$pkg/ui/dist/"
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/Namplifier-windows-vst3.zip" -Force

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: namplifier-windows-${{ github.sha }}
          path: |
            dist/Namplifier-windows-standalone.zip
            dist/Namplifier-windows-vst3.zip
          if-no-files-found: error
          retention-days: 30

      # Publish downloadable zips on the Releases page (push to main/master only).
      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Windows build ${{ github.run_number }}
          body: |
            Automated Windows build from merge/push to `${{ github.ref_name }}`.

            - Commit: `${{ github.sha }}`
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### Downloads
            - **Standalone** — `Namplifier-windows-standalone.zip` (exe + `ui/dist`)
            - **VST3** — `Namplifier-windows-vst3.zip`

            Requires WebView2 Runtime. Tone3000 features need a valid publishable key baked at build time via the `Namplifier_TONE3000_KEY` Actions secret.
          files: |
            dist/Namplifier-windows-standalone.zip
            dist/Namplifier-windows-vst3.zip
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: true
